spring:
  application:
    name: tiem-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/tiem}
    username: ${DB_USERNAME:tiem}
    password: ${DB_PASSWORD:tiem_dev_123}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080